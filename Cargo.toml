[package]
name = "pagerduty-rs"
version = "0.2.0"
authors = ["Archis Gore <me@archisgore.com>"]
edition = "2018"
license = "Apache-2.0"
categories = ["api-bindings", "web-programming::http-client"]
keywords = ["pagerduty", "alerts", "events", "incidents", "monitoring"]
readme = "README.md"
repository = "https://github.com/archisgore/pagerduty-rs"

description = """PagerDuty API from Rust."""


[features]
default = ["async", "reqwest/default"]

# Enable reqwest's blocking client on sync
sync = ["reqwest/blocking"]

# Need futures for Async
async = []

rustls = ["reqwest/rustls"]

[dependencies]
url = "2.5.8"
time = {version = "0.3.55", features = ["std", "serde", "formatting", "macros"]}
serde = {version = "1.0.229", features = ["derive"]}
reqwest = { version = "0.13.5", default-features = false, features = ["json"]}

[dev-dependencies]
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
rand = "0.10.3"
tokio = { version = "1.54.1", features = ["rt", "macros"]}
serde_json = "1.0.154"

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

